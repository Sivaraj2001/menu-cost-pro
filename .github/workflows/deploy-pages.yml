name: Deploy Menu Cost Pro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          corepack pnpm install --no-frozen-lockfile
      # Supabase URL and publishable key are public browser configuration, not server secrets.
      # Do not place service-role keys or other secrets here.
      - name: Check public Supabase configuration
        env:
          VITE_SUPABASE_URL: "https://c--482d3cd6-f7b1-459e-8915-c53fd8f459b9-prod.lovable.cloud"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_N6sppkq4ktisAuJVZrxjhw_R2qBXv3O"
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing repository variable VITE_SUPABASE_URL'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing repository variable VITE_SUPABASE_PUBLISHABLE_KEY'; exit 1; }
      - name: Build static website
        env:
          VITE_SUPABASE_URL: "https://c--482d3cd6-f7b1-459e-8915-c53fd8f459b9-prod.lovable.cloud"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_N6sppkq4ktisAuJVZrxjhw_R2qBXv3O"
        run: |
          corepack pnpm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
